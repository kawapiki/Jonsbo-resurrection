name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Invalid release tag' }
          $version = $Matches[1]
          if ($version -ne (Get-Content VERSION -Raw).Trim()) { throw 'Tag does not match VERSION' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test, vet and build
        shell: pwsh
        run: ./scripts/build.ps1 -Version $env:RELEASE_VERSION
      - name: Package and checksum
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - name: Publish versioned download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = "dist/JonsboResurrection-$env:RELEASE_VERSION-windows-amd64.zip"
          $notes = "docs/releases/$env:RELEASE_VERSION.md"
          $args = @('release','create',$env:RELEASE_TAG,'--verify-tag','--title',"Jonsbo Resurrection $env:RELEASE_TAG")
          if (Test-Path $notes) { $args += @('--notes-file',$notes) } else { $args += '--generate-notes' }
          if ($env:RELEASE_VERSION.Contains('-')) { $args += '--prerelease' }
          & gh @args $archive "$archive.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten.' }
